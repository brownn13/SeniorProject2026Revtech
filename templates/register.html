{% extends 'base.html' %}
{% block content %}
    <h2>Create Account</h2>
    <form method="POST">
        <label>Username</label>
        <input type="text" name="username" required autocomplete="off">
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit">Register</button>
    </form>
{% endblock %}
